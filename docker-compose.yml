version: '3'
services:
  app:
    image: 5scontrol/taqi-chat:0.1
    container_name: taqi-chat
    restart: always
    ports:
      - 3009:3000
    working_dir: /
    environment:
      MODEL_URL: http://localhost:3008
  llama.cpp:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    ports:
      - 3008:8080
    volumes:
      - /home/pc/maker-ai-server/volume:/models
    container_name: maker-ai-server-cpp
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    command: -m models/Mistral-7B-Instruct-v0.2.Q3_K_S.gguf --ctx-size 20000 --seed
      1 --temp 0.8 --top-k 40 --top-p 0.95 --min-p 0.05 --repeat-penalty
      1.18 --host 0.0.0.0 --port 8080 --n-gpu-layers 99 --parallel 4
      --cont-batching